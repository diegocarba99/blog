name: Deploy website to S3 bucket

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      - name: Download Hugo Binary
        run: |
          HUGO_VERSION=$(curl -s https://api.github.com/repos/gohugoio/hugo/releases/latest | grep "tag_name" | cut -d '"' -f 4)
          echo "Downloading Hugo ${HUGO_VERSION}"
          wget -q https://github.com/gohugoio/hugo/releases/download/${HUGO_VERSION}/hugo_extended_withdeploy_${HUGO_VERSION#v}_linux-amd64.tar.gz
          
          # Verify SHA256 hash
          EXPECTED_HASH="08200e4d82f086c94c301e8ba08102f9e23f38774ad949bb3251cac76283684a"
          ACTUAL_HASH=$(sha256sum hugo_extended_withdeploy_${HUGO_VERSION#v}_linux-amd64.tar.gz | cut -d ' ' -f 1)
          echo "Binary hash: ${ACTUAL_HASH}"
          
          if [ "${ACTUAL_HASH}" != "${EXPECTED_HASH}" ]; then
            echo "ERROR: Hash mismatch! Downloaded file may be corrupted or tampered with."
            exit 1
          fi
          echo "Hash verification successful!"
          
          tar -xzf hugo_extended_withdeploy_${HUGO_VERSION#v}_linux-amd64.tar.gz
          chmod +x hugo
          sudo mv hugo /usr/local/bin/
          hugo version

      - name: Build Hugo Site
        run: |
          hugo --minify

      - name: Debug OIDC Claims
        uses: steve-todorov/oidc-debugger-action@v1.0.2
        with:
          audience: '${{ github.server_url }}/${{ github.repository }}'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          role-to-assume: arn:aws:iam::490050289203:role/blog_gha_deploy_role
          role-session-name: gha_deploy_s3_blog
          aws-region: 'eu-west-1'

      - name: Dry run Deploy to S3
        if: github.event_name == 'pull_request'
        run: |
          hugo deploy --target "Website diej.org" --maxDeletes -1 --invalidateCDN --dryRun

      - name: Deploy to S3
        if: github.event_name != 'pull_request'
        run: |
          hugo deploy --target "Website diej.org" --maxDeletes -1 --invalidateCDN
