name: Deploy website to S3 bucket

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      - name: Download Hugo Binary
        run: |
          HUGO_VERSION=$(curl -s https://api.github.com/repos/gohugoio/hugo/releases/latest | grep "tag_name" | cut -d '"' -f 4)
          echo "Downloading Hugo ${HUGO_VERSION}"
          wget -q https://github.com/gohugoio/hugo/releases/download/${HUGO_VERSION}/hugo_extended_${HUGO_VERSION#v}_linux-amd64.tar.gz
          tar -xzf hugo_extended_${HUGO_VERSION#v}_linux-amd64.tar.gz
          chmod +x hugo
          sudo mv hugo /usr/local/bin/
          hugo version

      - name: Build Hugo Site
        run: |
          hugo --minify

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: arn:aws:iam::490050289203:role/blog_gha_deploy_role
          role-session-name: gha_deploy_s3_blog
          aws-region: 'eu-west-1'

      - name: Deploy to S3
        run: |
          hugo deploy --target "Website diej.org" --maxDeletes -1 --invalidateCDN
